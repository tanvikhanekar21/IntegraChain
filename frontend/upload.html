<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Document | IntegraChain</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="navbar">
        <div class="container nav-inner">
            <a href="index.html" class="brand" aria-label="IntegraChain home"><span class="brand-icon" aria-hidden="true">⬡</span>IntegraChain</a>
            <nav class="nav-links" aria-label="Main">
                <a href="index.html">Home</a>
                <a class="active" href="upload.html" aria-current="page">Register Document</a>
                <a href="verify.html">Verify Document</a>
                <a href="blockchain.html">Blockchain Explorer</a>
            </nav>
            <a href="upload.html" class="btn primary sm nav-cta">Register a Document</a>
        </div>
    </header>

    <main id="main" class="page">
        <div class="page-header">
            <p class="kicker">Document registration</p>
            <h1>Register Document</h1>
            <p>Create a cryptographic fingerprint and secure the document's integrity record.</p>
        </div>

        <div class="upload-panel">
            <form id="uploadForm">
                <label class="upload-area" for="uploadFile">
                    <div class="upload-icon" aria-hidden="true">↑</div>
                    <h3>Drop your document here</h3>
                    <p>or <span class="browse">browse files</span></p>
                    <span class="limits">PDF, TXT, JPG, JPEG, PNG · Maximum size: 10 MB</span>
                    <input type="file" id="uploadFile" accept=".pdf,.txt,.jpg,.jpeg,.png" required>
                </label>

                <div id="selectedFile" class="selected-file" aria-live="polite"></div>

                <button type="submit" id="uploadBtn" class="btn primary full-btn">Register Document</button>
            </form>
        </div>

        <div id="uploadResult" class="result-container" aria-live="polite"></div>
    </main>

    <footer>
        <div class="container footer-inner">
            <p><strong>IntegraChain</strong></p>
            <p class="footer-small">Blockchain-Powered Document Integrity &amp; Verification</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
