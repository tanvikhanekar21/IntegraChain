<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register Document | BlockVerify</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <nav class="navbar">

        <a href="index.html" class="brand">
            <span class="brand-icon">⬡</span>
            BlockVerify
        </a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a class="active" href="upload.html">Register</a>
            <a href="verify.html">Verify</a>
            <a href="blockchain.html">Blockchain</a>
        </div>

    </nav>


    <main class="page-wrapper">

        <div class="page-header">

            <p class="small-title">DOCUMENT REGISTRATION</p>

            <h1>Register Your Document</h1>

            <p>
                Create a secure SHA-256 fingerprint and store
                the document record in the blockchain.
            </p>

        </div>


        <div class="upload-panel">

            <form id="uploadForm">

                <label class="upload-area" for="uploadFile">

                    <div class="upload-icon">↑</div>

                    <h3>Choose a document</h3>

                    <p>
                        PDF, TXT, JPG, JPEG or PNG
                    </p>

                    <span>
                        Maximum file size: 10 MB
                    </span>

                    <input
                        type="file"
                        id="uploadFile"
                        accept=".pdf,.txt,.jpg,.jpeg,.png"
                        required
                    >

                </label>


                <p id="selectedFile"
                   class="selected-file">
                </p>


                <button type="submit"
                        class="btn primary full-btn">

                    Register Document →

                </button>

            </form>

        </div>


        <div id="uploadResult"
             class="result-container">
        </div>

    </main>


    <script src="js/script.js"></script>

</body>

</html>
