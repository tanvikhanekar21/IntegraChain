<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify Document | BlockVerify</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <nav class="navbar">

        <a href="index.html" class="brand">
            <span class="brand-icon">⬡</span>
            BlockVerify
        </a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="upload.html">Register</a>
            <a class="active" href="verify.html">Verify</a>
            <a href="blockchain.html">Blockchain</a>
        </div>

    </nav>


    <main class="page-wrapper">

        <div class="page-header">

            <p class="small-title">FILE VERIFICATION</p>

            <h1>Verify Document Integrity</h1>

            <p>
                Upload a document and check whether it is
                original, tampered with, or not registered.
            </p>

        </div>


        <div class="upload-panel">

            <form id="verifyForm">

                <label class="upload-area" for="verifyFile">

                    <div class="upload-icon">✓</div>

                    <h3>Select a document to verify</h3>

                    <p>
                        Upload the file for integrity verification
                    </p>

                    <input
                        type="file"
                        id="verifyFile"
                        accept=".pdf,.txt,.jpg,.jpeg,.png"
                        required
                    >

                </label>


                <p id="verifySelectedFile"
                   class="selected-file">
                </p>


                <button type="submit"
                        class="btn primary full-btn">

                    Verify Document

                </button>

            </form>

        </div>


        <div id="verifyResult"
             class="result-container">
        </div>

    </main>


    <script src="js/script.js"></script>

</body>

</html>
